name: Datafleets
description: DataFleets was a privacy-preserving data science and federated computation platform that let
  organizations run analytics and machine learning across distributed, siloed, or regulated datasets without
  centralizing or exposing the underlying raw data, using techniques such as federated learning and differential
  privacy to keep data in place while still enabling cross-silo insight. Founded as a venture-backed startup and
  backed by investors including Lightspeed Venture Partners, DataFleets was acquired by LiveRamp in early 2021.
  Its former datafleets.com domain now redirects to liveramp.com, and the company operates no independent public
  developer portal, API, or documentation, so there is no live API surface for the enrichment pipeline to harvest.
